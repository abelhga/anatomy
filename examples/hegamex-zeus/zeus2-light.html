label>Pausa</span></button><span class="hg-seg" role="group" aria-label="Tolvas"><a class="hg-chip" data-on href="zeus2-light.html">2 tolvas</a><a class="hg-chip" href="zeus-light.html">3 tolvas</a></span><span class="hg-clock" data-clock>0:00</span></div><table class="hg-table"><caption>Bachada de 7 m³ · concreto f'c 250 · receta por m³: cemento 350 kg, arena 800 kg, grava 950 kg, agua 190 L</caption><thead><tr><th scope="col">Material</th><th scope="col">Objetivo</th><th scope="col">Pesado</th><th scope="col" class="hg-bar-h"><span class="hg-sr">Avance</span></th></tr></thead><tbody><tr data-row="arena"><th scope="row"><span class="hg-key" data-grain="arena"></span>Arena</th><td>5,600 kg</td><td data-got>0 kg</td><td class="hg-bar"><span data-bar></span></td></tr><tr data-row="grava"><th scope="row"><span class="hg-key" data-grain="grava"></span>Grava 3/4"</th><td>6,650 kg</td><td data-got>0 kg</td><td class="hg-bar"><span data-bar></span></td></tr><tr data-row="cemento"><th scope="row"><span class="hg-key" data-grain="cemento"></span>Cemento</th><td>2,450 kg</td><td data-got>0 kg</td><td class="hg-bar"><span data-bar></span></td></tr><tr data-row="agua"><th scope="row"><span class="hg-key" data-grain="agua"></span>Agua</th><td>1,330 L</td><td data-got>0 L</td><td class="hg-bar"><span data-bar></span></td></tr></tbody></table></div><figcaption class="iso-legend"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Tolvas sobre 4 celdas de carga cada una: pesan lo que sale</span><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Banda de 26&quot;: lleva los agregados al matacaídas</span><span class="iso-key"><svg class="iso-swatch" data-mark="flat" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 6.5 8 3.5 14 6.5 8 9.5Z"/></svg>Bazuca de 8&quot; del Thor: mete el cemento por arriba</span></span><span class="iso-caption">La Zeus 30 dosifica hasta 65 m³/h. Cada tolva de 9 m³ descansa en celdas de carga y su compuerta de almeja abre hasta que la tolva pierde exactamente el peso de la receta; la banda lo sube al matacaídas. Al mismo tiempo el Thor 36 (50 t de cemento, pesado con 4 celdas de 30 t) entrega el cemento con su bazuca y el tanque de 2,100 L pesa el agua por masa, no por volumen. Todo cae por la manga de 60 cm a la olla. Tiempos reales de una olla de 7 m³ a 65 m³/h, mostrados 8 veces más rápido.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],

  };
  if (!steps) drop(1);
  for (let n = 0; n < steps; n++) {
    const out = state.cells.pop();
    if (out) state.delivered += out.kg;
    state.cells.unshift(null);
    drop(1 / steps);
  }
  if (t1 > D.cemento.from && t0 < D.cemento.to) {
    const take = Math.max(0, Math.min(D.cemento.kg - state.cement, (D.cemento.kg / (D.cemento.to - D.cemento.from)) * span));
    state.cement += take;
    state.thor -= take;
    state.delivered += take;
  }
  if (t1 > D.agua.from && t0 < D.agua.to) {
    const take = Math.max(0, Math.min(D.agua.litres - state.water, (D.agua.litres / (D.agua.to - D.agua.from)) * span));
    state.water += take;
    state.tank -= take;
    state.delivered += take;
  }
}

function tick(dt) {
  state.clock += dt;
  const since = state.clock - state.phaseAt;
  state.drumPhase = (state.drumPhase + dt * (state.phase === "mix" ? 2.6 : 1.4)) % 1;
  if (state.phase === "arrive") {
    state.truck = 1 - ease(since / 3.2);
    if (since > 3.6) go("dose");
  } else if (state.phase === "dose") {
    stepDose(dt * D.speedup);
    if (state.t >= D.end) go("mix");
  } else if (state.phase === "mix") {
    if (since > 2.2) go("leave");
  } else if (state.phase === "leave") {
    state.truck = ease(since / 3);
    if (since > 3.2) {
      go("refill");
      state.from = state.volume.slice();
      state.tankFrom = state.tank;
    }
  } else if (state.phase === "refill") {
    const share = ease(since / 3);
    state.volume = state.volume.map((_, i) => state.from[i] + (D.hoppers[i].start - state.from[i]) * share);
    state.tank = state.tankFrom + (D.tank * 0.95 - state.tankFrom) * share;
    state.gate = state.gate.map((g) => g * (1 - share));
    if (since > 3.4) {
      resetBatch();
      go("arrive");
    }
  }
}

function render() {
  drawHoppers();
  drawJaws();
  drawLoads();
  drawWater();
  place();
  const index = Math.floor(state.drumPhase * D.ribs.length) % D.ribs.length;
  if (drum.dataset.at !== String(index)) {
    drum.dataset.at = String(index);
    drum.innerHTML = D.ribs[index];
  }
  describe();
}

let frame = 0;
let last = 0;
let visible = false;
function loop(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 20) : 1 / 60;
  last = now;
  if (state.running) tick(dt);
  render();
  frame = visible && state.running ? requestAnimationFrame(loop) : 0;
}
function run() {
  if (!frame && visible && state.running) {
    last = 0;
    frame = requestAnimationFrame(loop);
  }
}
function setRunning(on) {
  state.running = on;
  playButton.setAttribute("aria-pressed", String(on));
  playLabel.textContent = on ? "Pausa" : "Continuar";
  if (on) run();
}
playButton.addEventListener("click", () => setRunning(!state.running));
stage.addEventListener("keydown", (event) => {
  if (event.key === " " || event.key === "Enter") {
    event.preventDefault();
    setRunning(!state.running);
  }
});
new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  run();
}, { rootMargin: "120px 0px" }).observe(stage);

if (still.matches) {
  state.truck = 0;
  state.phase = "dose";
  stepDose(D.end * 0.55);
  setRunning(false);
}
render();
window.__zeus = { state, D };
</script></body></html>
